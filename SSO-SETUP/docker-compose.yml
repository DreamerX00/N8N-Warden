# ─────────────────────────────────────────────────────────────────────────
#  SSO gateway for self-hosted n8n Community Edition
#
#  Caddy (TLS + path split + forward-auth)  →  oauth2-proxy (OIDC)  →  n8n
#
#  n8n is NEVER modified. Your IdP authenticates users at the front door;
#  only authenticated requests to the editor/UI reach n8n. Webhooks, forms,
#  MCP and health checks bypass the gate so integrations keep working.
#
#  Fill in ./.env from ./.env.example, then:  docker compose up -d
#  Full guide + testing matrix: ./README.md
# ─────────────────────────────────────────────────────────────────────────

services:
  # ── Edge: TLS termination, routing, and the auth decision ──────────────
  caddy:
    image: caddy:2-alpine
    container_name: n8n-sso-caddy
    restart: unless-stopped
    ports:
      - "80:80"     # ACME HTTP-01 challenge + HTTPS redirect
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # holds issued TLS certs — back this up
      - caddy_config:/config
    environment:
      - N8N_DOMAIN=${N8N_DOMAIN}
    depends_on:
      - oauth2-proxy
      - n8n

  # ── Auth engine: OIDC relying party, called by Caddy's forward_auth ────
  oauth2-proxy:
    # Pin >= 7.15.2. The fixes that matter for THIS topology, in order:
    #   7.11.0  CVE-2025-54576 — skip_auth_routes matched the query string too
    #   7.13.0  CVE-2025-64484 — request header smuggling
    #   7.15.2  CRITICAL — X-Forwarded-Uri spoofing auth bypass, session
    #           fixation, health-check user-agent bypass. Directly exploitable
    #           in forward-auth deployments like this one.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    container_name: n8n-sso-oauth2-proxy
    restart: unless-stopped
    command: --config=/oauth2-proxy.cfg
    volumes:
      - ./oauth2-proxy.cfg:/oauth2-proxy.cfg:ro
    environment:
      # Secrets come from .env (never commit real values).
      OAUTH2_PROXY_CLIENT_ID:     ${OIDC_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OAUTH2_PROXY_REDIRECT_URL:  https://${N8N_DOMAIN}/oauth2/callback
      OAUTH2_PROXY_COOKIE_DOMAINS: ${N8N_DOMAIN}
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${N8N_DOMAIN}
    expose:
      - "4180"

  # ── n8n itself: completely unmodified, not published to the host ───────
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_TAG:-2.34.6}
    container_name: n8n
    restart: unless-stopped
    # Testing-matrix step 10 checks `docker inspect n8n` for health — without
    # this there is no health status to inspect.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      - N8N_HOST=${N8N_DOMAIN}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      # Public URLs n8n advertises for webhooks/editor — must be the real domain,
      # or Slack/GitHub/etc. get handed the wrong (internal :5678) callback URL.
      - N8N_EDITOR_BASE_URL=https://${N8N_DOMAIN}/
      - WEBHOOK_URL=https://${N8N_DOMAIN}/
      # HTTPS end-to-end: keep the session cookie Secure.
      - N8N_SECURE_COOKIE=true
      # Number of proxies in front that rewrite X-Forwarded-*. Just Caddy = 1.
      # Add a CDN/LB in front and increment, or n8n miscomputes client IP.
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - TZ=${GENERIC_TIMEZONE:-UTC}
      # 2.x-ready defaults (harmless, forward-compatible)
      - N8N_RUNNERS_ENABLED=true
      - DB_SQLITE_POOL_SIZE=10
    volumes:
      - n8n_data:/home/node/.n8n     # uid 1000 — chown the host dir if bind-mounting
    expose:
      - "5678"                        # reachable only inside the compose network

volumes:
  caddy_data:
  caddy_config:
  n8n_data:
