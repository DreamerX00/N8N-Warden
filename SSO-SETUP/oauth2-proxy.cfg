# oauth2-proxy — OIDC relying party, forward-auth mode.
# Secrets (client id/secret, cookie secret, issuer) are injected from .env via
# OAUTH2_PROXY_* environment variables in docker-compose.yml, so they never
# live in this committed file.

provider = "oidc"

# Listen for Caddy's forward_auth calls and the /oauth2/* browser endpoints.
http_address = "0.0.0.0:4180"

# We sit behind Caddy: trust its X-Forwarded-* and emit auth headers.
reverse_proxy = true
set_xauthrequest = true

# Forward-auth mode: oauth2-proxy only answers "authenticated?" — Caddy proxies
# the real traffic to n8n. static://200 keeps oauth2-proxy from needing its own
# upstream to n8n.
upstreams = ["static://200"]

# Who may in? Ships FAIL-CLOSED on purpose: this placeholder domain matches
# nobody, so an unedited deploy locks everyone out instead of letting the whole
# internet's worth of IdP-authenticated identities into your editor.
# Set one (or both):
#   - email_domains  = ["yourcompany.com"]        (allow a whole domain)
#   - allowed_groups = [...]                      (see below — stricter, preferred)
# "*" means "anyone the IdP authenticates" — never leave that in production.
email_domains = ["CHANGE-ME.example.com"]

# Cookie: Secure + SameSite=lax so the IdP redirect round-trip keeps it.
cookie_secure = true
cookie_samesite = "lax"
cookie_expire = "168h0m0s"     # 7 days; refresh below keeps sessions fresh
cookie_refresh = "1h0m0s"

# Scopes. openid is required; email/profile/groups as your IdP supports them.
scope = "openid email profile"

# Uncomment to gate on an IdP group instead of email domain:
# allowed_groups = ["n8n-users"]
# oidc_groups_claim = "groups"
#
# Prism (SAML) users: the prism-saml/ variant brokers Prism's SAML assertion
# into an OIDC "groups" claim, so both lines above work unchanged there.

# Skip provider button — go straight to the IdP.
skip_provider_button = true
