# ─────────────────────────────────────────────────────────────────────────
#  n8n SSO — nginx server block for an existing ALB → nginx → n8n stack
#
#  Topology:  ALB (TLS)  →  nginx (THIS config)  →  oauth2-proxy (auth)
#                                                 →  n8n (unmodified)
#
#  Drop this into your nginx (conf.d/ or sites-enabled/), point the upstreams
#  at where oauth2-proxy and n8n listen (see docker-compose.yml in this dir),
#  and reload. n8n is never touched.
#
#  TLS is terminated at the ALB, so nginx listens on plain HTTP behind it and
#  trusts the ALB's X-Forwarded-Proto. n8n runs with N8N_PROXY_HOPS=2
#  (ALB + nginx).
# ─────────────────────────────────────────────────────────────────────────

# WebSocket upgrade mapping (put once, at http{} scope — here if this file is
# included at http level, else move to your main nginx.conf).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Honor the scheme the ALB terminated (nginx itself sees http behind the ALB).
map $http_x_forwarded_proto $public_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    server_name n8n.example.com;   # ← your domain

    # ── Upstreams, resolved at REQUEST time, not at startup ────────────────
    # Deliberately `set` variables rather than upstream{} blocks. nginx resolves
    # an upstream{} name once, at startup, and refuses to start if it does not
    # resolve — which deadlocks a containerised deployment: oauth2-proxy cannot
    # reach its OIDC issuer until nginx is up, so it restarts; while it restarts
    # it has no DNS record; so nginx never starts. Runtime resolution breaks the
    # cycle, and keeps nginx alive across any single container restart (you get
    # a 502 from that one upstream instead of a dead site).
    #
    # Point these three at wherever the services actually listen.
    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's embedded DNS. Never
                                              # consulted while the values below
                                              # are literal IPs, as they are here.
    set $n8n_upstream      "http://127.0.0.1:5678";   # or http://n8n:5678
    set $oauth2_upstream   "http://127.0.0.1:4180";   # or http://oauth2-proxy:4180
    # Only used by the prism-saml/ variant (Keycloak as the Prism SAML broker).
    set $keycloak_upstream "http://127.0.0.1:8080";   # or http://keycloak:8080

    # Big enough for workflow imports / large payloads.
    client_max_body_size 32m;
    # Those same cookies come back on every request — the request-side limit
    # has to match, or you get 400 Bad Request once a session exists.
    large_client_header_buffers 4 32k;

    # Security headers. NOTE the nginx inheritance rule: add_header is inherited
    # by a location ONLY if that location declares no add_header of its own —
    # `location /` sets Set-Cookie, so these are repeated there. Same trap
    # applies to proxy_set_header, which is why the header-stripping below is
    # written out per-location instead of once here.
    # 'always' so they survive the 302/401 responses on the SSO redirect path.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── oauth2-proxy's own endpoints (sign-in, callback, sign-out) ─────────
    location /oauth2/ {
        # oauth2-proxy's session cookie carries the ID token; with real name
        # and group claims its Set-Cookie headers blow past nginx's 4k/8k
        # default and nginx answers 502 having already spent the auth code.
        proxy_buffer_size   32k;
        proxy_buffers       8 32k;
        proxy_busy_buffers_size 64k;
        proxy_pass       $oauth2_upstream$request_uri;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_proto;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        # Never let a caller's own copy of these reach the auth engine.
        proxy_set_header X-Forwarded-Uri    "";
        proxy_set_header X-Forwarded-Method "";
    }

    # The internal auth check nginx calls on every gated request.
    location = /oauth2/auth {
        # oauth2-proxy's session cookie carries the ID token; with real name
        # and group claims its Set-Cookie headers blow past nginx's 4k/8k
        # default and nginx answers 502 having already spent the auth code.
        proxy_buffer_size   32k;
        proxy_buffers       8 32k;
        proxy_busy_buffers_size 64k;
        internal;
        # Literal path, NOT $request_uri: inside an auth subrequest $request_uri
        # is still the original request's URI, which would miss this endpoint.
        proxy_pass       $oauth2_upstream/oauth2/auth;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_proto;
        # Tell oauth2-proxy which URI is actually being authorized. Set here from
        # nginx's own $request_uri, never from anything the client sent.
        proxy_set_header X-Forwarded-Uri   $request_uri;
        proxy_set_header X-Forwarded-Method $request_method;
        proxy_set_header X-Auth-Request-User  "";
        proxy_set_header X-Auth-Request-Email "";
        proxy_set_header X-Auth-Request-Groups "";
        # No body needed for the auth subrequest.
        proxy_set_header Content-Length   "";
        proxy_pass_request_body           off;
    }

    # ── Keycloak (prism-saml/ variant only) — the Prism SAML broker ────────
    # Un-gated for the same reason /oauth2/ is: it IS the login flow. Served
    # under /auth/ on this hostname so no second DNS record or cert is needed.
    # Delete this block if you are not brokering SAML.
    # Prism POSTs the SAML assertion to the broker endpoint. A GET here means a
    # human opened the ACS URL directly — bookmark, stale tab, back button, a
    # retried IdP-initiated link — and Keycloak answers "Restart login cookie
    # not found", which reads as a failure but only means no login was in
    # flight. Send them to the front door, which starts a clean flow.
    #
    # `endpoint$` deliberately does NOT match .../endpoint/descriptor: that is a
    # legitimate GET serving the SP metadata Prism needs.
    location ~ ^/auth/realms/[^/]+/broker/[^/]+/endpoint$ {
        if ($request_method != POST) { return 302 /; }
        proxy_pass       $keycloak_upstream$request_uri;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_proto;
        proxy_set_header X-Forwarded-Port  443;
        proxy_buffer_size   16k;
        proxy_buffers       8 16k;
        proxy_busy_buffers_size 32k;
    }

    location /auth/ {
        proxy_pass       $keycloak_upstream$request_uri;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_proto;
        proxy_set_header X-Forwarded-Port  443;
        # SAML POST bindings carry a base64 assertion — the default 4k/8k
        # header+body buffers are tight for large group claims.
        proxy_buffer_size   16k;
        proxy_buffers       8 16k;
        proxy_busy_buffers_size 32k;
    }

    # ── BYPASS: machine-to-machine paths — NO auth_request ─────────────────
    # Verified present on n8n 2.34.5. External callers can't do interactive SSO.
    location ~ ^/(webhook|webhook-test|webhook-waiting|form|form-test|form-waiting|mcp|mcp-test)/ {
        proxy_pass       $n8n_upstream$request_uri;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Health (ALB target health check should hit /healthz — keep it un-gated).
    location = /healthz            { proxy_pass $n8n_upstream$request_uri; }
    location /healthz/             { proxy_pass $n8n_upstream$request_uri; }

    # n8n's OWN credential-OAuth callbacks (Google Sheets etc.) — the provider
    # redirect can arrive without the session cookie, so don't gate it.
    location = /rest/oauth2-credential/callback { proxy_pass $n8n_upstream$request_uri;
        proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $public_proto; }
    location = /rest/oauth1-credential/callback { proxy_pass $n8n_upstream$request_uri;
        proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $public_proto; }

    # Public API (X-N8N-API-KEY, not cookies). Bypass so scripts/CI keep working.
    # DELETE this block to force API traffic through SSO too.
    location /api/ {
        proxy_pass       $n8n_upstream$request_uri;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_proto;
    }

    # ── GATED: editor UI, /rest/* (incl. the /rest/push WebSocket) ─────────
    location / {
        # oauth2-proxy's session cookie carries the ID token; with real name
        # and group claims its Set-Cookie headers blow past nginx's 4k/8k
        # default and nginx answers 502 having already spent the auth code.
        proxy_buffer_size   32k;
        proxy_buffers       8 32k;
        proxy_busy_buffers_size 64k;
        auth_request /oauth2/auth;

        # Not authenticated → send the browser to Prism via oauth2-proxy.
        error_page 401 = @sso_signin;

        # Carry identity to n8n (logging/audit only — n8n CE ignores these).
        # These assignments also OVERWRITE anything the client sent under the
        # same names, which is the point: identity comes from the auth response,
        # never from the request.
        auth_request_set $auth_user  $upstream_http_x_auth_request_user;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-Request-User  $auth_user;
        proxy_set_header X-Auth-Request-Email $auth_email;
        proxy_set_header X-Auth-Request-Preferred-Username "";
        proxy_set_header X-Auth-Request-Groups "";
        proxy_set_header X-Forwarded-Uri      "";
        proxy_set_header X-Forwarded-Method   "";

        # Repeated from server level — the Set-Cookie add_header below would
        # otherwise cancel inheritance and drop all four silently.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # Let oauth2-proxy refresh its cookie through the subrequest.
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;

        proxy_pass       $n8n_upstream$request_uri;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_proto;

        # WebSocket for the editor's live push (/rest/push).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;      # keep long-lived push connections open
    }

    location @sso_signin {
        return 302 $public_proto://$host/oauth2/sign_in?rd=$public_proto://$host$request_uri;
    }
}
